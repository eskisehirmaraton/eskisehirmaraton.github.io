      if (!touch) return;
      var dx = touch.clientX - swipeX;
      var dy = touch.clientY - swipeY;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
    }, { passive: true });
    currentLang = detectLang();
    applyLang();
    var q = new URLSearchParams(location.search).get('bib');
    if (q) { input.value = normalize(q); lastQuery = q; render(q); }
  </script>
</body>
</html>
