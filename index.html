s://www.eskisehiryarimaratonu.com/maraton2/1065.jpg"}, {"file": "1665.jpg", "src": "990/yuz_001665.jpg", "kaynak": "yuz", "web": "https://www.eskisehiryarimaratonu.com/maraton2/1665.jpg"}]};
    const WEB_BASE = 'https://www.eskisehiryarimaratonu.com/maraton2/';
    const input = document.getElementById('bib');
    const grid = document.getElementById('grid');
    const meta = document.getElementById('meta');
    const err = document.getElementById('err');
    const lb = document.getElementById('lb');
    const lbimg = document.getElementById('lbimg');
    const lbcnt = document.getElementById('lbcnt');
    let currentItems = [];
    let currentIndex = 0;

    function normalize(v) { return String(v || '').replace(/\D/g, ''); }
    function photoUrl(it) {
      if (it && it.web) return it.web;
      const file = (it && it.file) ? String(it.file).replace(/^.*\//, '') : '';
      return file ? WEB_BASE + file : '';
    }
    function resolveBib(raw) {
      const bib = normalize(raw);
      if (!bib) return '';
      if (DATA[bib]) return bib;
      const stripped = bib.replace(/^0+/, '') || '0';
      if (DATA[stripped]) return stripped;
      for (const w of [3, 4]) {
        const padded = stripped.padStart(w, '0');
        if (DATA[padded]) return padded;
      }
      return '';
    }
    function closeLb() {
      lb.classList.remove('open');
      lb.setAttribute('aria-hidden', 'true');
      lbimg.removeAttribute('src');
    }
    function showLb() {
      if (!currentItems.length) return;
      const n = currentItems.length;
      currentIndex = ((currentIndex % n) + n) % n;
      const it = currentItems[currentIndex];
      lbimg.src = photoUrl(it);
      lbimg.alt = (it.kaynak==='bib'?'BIB':'YÜZ');
      lbcnt.textContent = (currentIndex + 1) + ' / ' + n;
      lb.classList.add('open');
      lb.setAttribute('aria-hidden', 'false');
    }
    function openLb(idx) {
      currentIndex = idx;
      showLb();
    }
    function step(delta) {
      if (!lb.classList.contains('open') || !currentItems.length) return;
      currentIndex += delta;
      showLb();
    }
    function render(raw) {
      grid.innerHTML = '';
      meta.textContent = '';
      currentItems = [];
      closeLb();
      const typed = normalize(raw);
      if (!typed) {
        err.textContent = 'Lütfen göğüs numaranızı yazın.';
        return;
      }
      const bib = resolveBib(typed);
      if (!bib || !DATA[bib]) {
        err.textContent = typed + ' numarası bulunamadı. Bu göğüs no galeride tespit edilmedi.';
        return;
      }
      err.textContent = '';
      const items = DATA[bib];
      currentItems = items;
      const nBib = items.filter(i => i.kaynak === 'bib').length;
      const nYuz = items.filter(i => i.kaynak === 'yuz').length;
      meta.textContent = items.length + ' fotoğraf  ·  bib: ' + nBib + '  ·  yüz: ' + nYuz;
      items.forEach((it, idx) => {
        const fig = document.createElement('figure');
        const src = photoUrl(it);
        const tag = it.kaynak==='bib' ? 'BIB' : 'YÜZ';
        fig.innerHTML = '<img src="'+src+'" alt="'+bib+' '+tag+'"><span class="'+(it.kaynak==='bib'?'tag-bib':'tag-yuz')+'">'+tag+'</span>';
        fig.querySelector('img').onclick = () => openLb(idx);
        grid.appendChild(fig);
      });
    }
    document.getElementById('go').onclick = () => render(input.value);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') render(input.value); });
    document.getElementById('lbclose').onclick = (e) => { e.stopPropagation(); closeLb(); };
    document.getElementById('lbprev').onclick = (e) => { e.stopPropagation(); step(-1); };
    document.getElementById('lbnext').onclick = (e) => { e.stopPropagation(); step(1); };
    lbimg.onclick = (e) => e.stopPropagation();
    lb.onclick = () => closeLb();
    document.addEventListener('keydown', (e) => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') closeLb();
      if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
      if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    });
    let swipeX = 0, swipeY = 0;
    lb.addEventListener('touchstart', (e) => {
      const t = e.changedTouches[0];
      if (!t) return;
      swipeX = t.clientX;
      swipeY = t.clientY;
    }, { passive: true });
    lb.addEventListener('touchend', (e) => {
      if (!lb.classList.contains('open')) return;
      const t = e.changedTouches[0];
      if (!t) return;
      const dx = t.clientX - swipeX;
      const dy = t.clientY - swipeY;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
    }, { passive: true });
    const q = new URLSearchParams(location.search).get('bib');
    if (q) { input.value = normalize(q); render(q); }
  </script>
